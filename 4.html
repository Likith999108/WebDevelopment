<!DOCTYPE html>
<html>
<head>
  <title>Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

  <div class="container">

    <a class="navbar-brand fw-bold" href="#">ShopEasy</a>

    <button class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">

      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Products</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle"
             data-bs-toggle="dropdown">
            Categories
          </a>

          <ul class="dropdown-menu">
            <li><a class="dropdown-item">Electronics</a></li>
            <li><a class="dropdown-item">Fashion</a></li>
            <li><a class="dropdown-item">Home</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link">Offers</a>
        </li>

        <li class="nav-item">
          <a class="nav-link">Contact</a>
        </li>

        <li class="nav-item">
          <a class="nav-link">Login</a>
        </li>

        <li class="nav-item">
          <a class="nav-link">🛒 Cart</a>
        </li>

      </ul>

    </div>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
