<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Demo</title>

    <style>
        /* Center align the webpage title */
        h1 {
            color: blue;
            text-align: center;
        }

        h2 {
            color: green;
            text-align: center;
        }

        h3 {
            color: red;
            text-align: center;
        }

        /* Apply borders to paragraphs */
        p {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
        }

        body {
            background-color: #f5f5dc;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Welcome to Internal CSS</h1>

    <h2>Different Heading Colors</h2>

    <h3>CSS Styling Example</h3>

    <p>
        This is the first paragraph. It has a black border applied using internal CSS.
    </p>

    <p>
        This is the second paragraph. It also has a border, padding, and margin.
    </p>

</body>
</html>
