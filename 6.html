<!DOCTYPE html>
<html>
<head>
  <title>Products and Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">

  <!-- Breadcrumb -->
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item">Home</li>
      <li class="breadcrumb-item active">Products</li>
    </ol>
  </nav>

  <h2>Products</h2>

  <!-- Product Cards -->
  <div class="row g-4">

    <div class="col-md-4">
      <div class="card">
        <img src="https://via.placeholder.com/300x180"
             class="card-img-top">

        <div class="card-body">
          <h5>Laptop</h5>
          <p>₹50,000</p>
          <p class="text-warning">★★★★★</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://via.placeholder.com/300x180"
             class="card-img-top">

        <div class="card-body">
          <h5>Smartphone</h5>
          <p>₹25,000</p>
          <p class="text-warning">★★★★☆</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Cart Table -->
  <h2 class="mt-5">Shopping Cart</h2>

  <div class="table-responsive">
    <table class="table table-bordered">

      <thead class="table-dark">
        <tr>
          <th>Product</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Total</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Laptop</td>
          <td>1</td>
          <td>₹50,000</td>
          <td>₹50,000</td>
        </tr>

        <tr>
          <td>Smartphone</td>
          <td>2</td>
          <td>₹25,000</td>
          <td>₹50,000</td>
        </tr>

        <tr class="table-success">
          <th colspan="3">Grand Total</th>
          <th>₹1,00,000</th>
        </tr>
      </tbody>

    </table>
  </div>

</div>

</body>
</html>
