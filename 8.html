<!DOCTYPE html>
<html>
<head>
  <title>ShopEasy E-Commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <a class="navbar-brand" href="#">ShopEasy</a>

    <button class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link">Home</a></li>
        <li class="nav-item"><a class="nav-link">Products</a></li>
        <li class="nav-item"><a class="nav-link">Offers</a></li>
        <li class="nav-item"><a class="nav-link">Contact</a></li>
      </ul>
      <button class="btn btn-warning">🛒 Cart</button>
    </div>

  </div>
</nav>

<!-- Hero -->
<section class="container-fluid bg-primary text-white text-center p-5">
  <h1>Big Shopping Sale</h1>
  <p class="lead">Up to 50% OFF</p>
  <button class="btn btn-warning btn-lg">Shop Now</button>
</section>

<!-- Categories -->
<section class="container my-5">
  <h2 class="text-center">Categories</h2>

  <div class="row g-3 mt-3">
    <div class="col-6 col-md-3">
      <div class="card p-3 text-center">Electronics</div>
    </div>

    <div class="col-6 col-md-3">
      <div class="card p-3 text-center">Fashion</div>
    </div>

    <div class="col-6 col-md-3">
      <div class="card p-3 text-center">Home</div>
    </div>

    <div class="col-6 col-md-3">
      <div class="card p-3 text-center">Sports</div>
    </div>
  </div>
</section>

<!-- Products -->
<section class="container my-5">
  <h2 class="text-center">Featured Products</h2>

  <div class="row g-4 mt-2">

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card p-3">
        <h5>Laptop</h5>
        <p>₹50,000</p>
        <button class="btn btn-primary">Add to Cart</button>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card p-3">
        <h5>Mobile</h5>
        <p>₹25,000</p>
        <button class="btn btn-primary">Add to Cart</button>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card p-3">
        <h5>Headphones</h5>
        <p>₹2,500</p>
        <button class="btn btn-primary">Add to Cart</button>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card p-3">
        <h5>Smart Watch</h5>
        <p>₹5,000</p>
        <button class="btn btn-primary">Add to Cart</button>
      </div>
    </div>

  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-4">
  <h5>ShopEasy</h5>
  <p>© 2026 ShopEasy. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
