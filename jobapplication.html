<!DOCTYPE html>
<html>
<head>
    <title>Online Job Application Form</title>
</head>
<body>

<h2>Online Job Application Form</h2>

<form>

    <!-- Full Name -->
    <label>Full Name:</label><br>
    <input type="text" name="fullname" placeholder="Enter your full name" required>
    <br><br>

    <!-- Email -->
    <label>Email Address:</label><br>
    <input type="email" name="email" placeholder="example@gmail.com" required>
    <br><br>

    <!-- Phone Number -->
    <label>Phone Number:</label><br>
    <input type="tel" name="phone" placeholder="9876543210" required>
    <br><br>

    <!-- Date of Birth -->
    <label>Date of Birth:</label><br>
    <input type="date" name="dob" required>                                          
    <br><br>

    <!-- Preferred Interview Time -->
    <label>Preferred Interview Time:</label><br>
    <input type="time" name="interview_time" required>
    <br><br>

    <!-- Age -->
    <label>Age:</label><br>
    <input type="number" name="age" min="18" max="60" placeholder="18-60" required>
    <br><br>

    <!-- Portfolio Website -->
    <label>Portfolio Website:</label><br>
    <input type="url" name="portfolio" placeholder="https://example.com">
    <br><br>

    <!-- Upload Resume -->
    <label>Upload Resume:</label><br>
    <input type="file" name="resume" required>
    <br><br>

    <!-- Experience -->
    <label>Experience (Years):</label><br>
    <input type="range" name="experience" min="0" max="20" value="0">
    <br><br>

    <!-- Position -->
    <label>Position Applying For:</label><br>
    <select name="position" required>
        <option value="">--Select Position--</option>
        <option>Software Developer</option>
        <option>Web Designer</option>
        <option>Data Analyst</option>
        <option>System Administrator</option>
    </select>
    <br><br>

    <!-- Cover Letter -->
    <label>Cover Letter:</label><br>
    <textarea name="coverletter" rows="5" cols="40"
        placeholder="Write a short cover letter..." required></textarea>
    <br><br>

    <!-- Buttons -->
    <input type="submit" value="Submit Application">
    <input type="reset" value="Reset">

</form>

</body>
</html>
