<!DOCTYPE html>
<html>
<head>
  <title>Offers Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">

  <div id="offers" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators -->
    <div class="carousel-indicators">
      <button data-bs-target="#offers"
              data-bs-slide-to="0"
              class="active"></button>

      <button data-bs-target="#offers"
              data-bs-slide-to="1"></button>

      <button data-bs-target="#offers"
              data-bs-slide-to="2"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner text-center">

      <div class="carousel-item active bg-danger text-white p-5">
        <h1>Festival Sale</h1>
        <p>Up to 70% OFF</p>
        <button class="btn btn-light">Shop Now</button>
      </div>

      <div class="carousel-item bg-primary text-white p-5">
        <h1>Electronics Sale</h1>
        <p>Best deals on gadgets</p>
        <button class="btn btn-light">Explore</button>
      </div>

      <div class="carousel-item bg-warning p-5">
        <h1>Fashion Sale</h1>
        <p>Latest fashion at low prices</p>
        <button class="btn btn-dark">Shop Fashion</button>
      </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev"
            data-bs-target="#offers"
            data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next"
            data-bs-target="#offers"
            data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
