<!DOCTYPE html>
<html>
<head>
  <title>Product Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">

  <div class="row align-items-center">

    <div class="col-md-6">
      <img src="https://via.placeholder.com/500"
           class="img-fluid rounded"
           alt="Smartphone">
    </div>

    <div class="col-md-6">

      <h1 class="display-5 fw-bold">Premium Smartphone</h1>

      <p class="text-muted">Latest Model | 256GB</p>

      <h2 class="text-success">₹29,999</h2>

      <p>
        <del>₹39,999</del>
        <span class="badge bg-danger">25% OFF</span>
      </p>

      <p class="lead">
        A powerful smartphone with excellent camera,
        fast processor and long-lasting battery.
      </p>

      <button class="btn btn-primary btn-lg">
        Add to Cart
      </button>

      <button class="btn btn-success btn-lg">
        Buy Now
      </button>

      <button class="btn btn-outline-danger">
        Wishlist
      </button>

    </div>

  </div>
</div>

</body>
</html>
